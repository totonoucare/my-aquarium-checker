<h1>混泳相性チェック</h1>
<p>飼いたい魚・エビ・貝を選ぶと、組み合わせの注意点を確認できます。</p>
</section>
<section class="tool-layout">
<form class="tool-card" id="combo-form">
<h2>飼いたい生体を選択</h2>
<fieldset>
<legend>小型群泳魚</legend>
<div class="option-grid">
<label class="option-card"><input type="checkbox" value="neon"/>ネオンテトラ</label>
<label class="option-card"><input type="checkbox" value="cardinal"/>カージナルテトラ</label>
<label class="option-card"><input type="checkbox" value="rasbora"/>ラスボラ</label>
<label class="option-card"><input type="checkbox" value="whitecloud"/>アカヒレ</label>
<label class="option-card"><input type="checkbox" value="medaka"/>メダカ</label>
</div>
</fieldset>
<fieldset>
<legend>カラフル・繁殖系</legend>
<div class="option-grid">
<label class="option-card"><input type="checkbox" value="guppy"/>グッピー</label>
<label class="option-card"><input type="checkbox" value="platy"/>プラティ</label>
</div>
</fieldset>
<fieldset>
<legend>主役系</legend>
<div class="option-grid">
<label class="option-card"><input type="checkbox" value="betta"/>ベタ</label>
<label class="option-card"><input type="checkbox" value="angelfish"/>エンゼルフィッシュ</label>
</div>
</fieldset>
<fieldset>
<legend>底もの・掃除役</legend>
<div class="option-grid">
<label class="option-card"><input type="checkbox" value="corydoras"/>コリドラス</label>
<label class="option-card"><input type="checkbox" value="otocinclus"/>オトシンクルス</label>
<label class="option-card"><input type="checkbox" value="nerite"/>石巻貝</label>
</div>
</fieldset>
<fieldset>
<legend>エビ</legend>
<div class="option-grid">
<label class="option-card"><input type="checkbox" value="minami"/>ミナミヌマエビ</label>
<label class="option-card"><input type="checkbox" value="redcherry"/>レッドチェリーシュリンプ</label>
<label class="option-card"><input type="checkbox" value="yamato"/>ヤマトヌマエビ</label>
</div>
</fieldset>
<button class="button full" type="submit">相性をチェック</button>
</form>
<section aria-live="polite" class="result-card" id="combo-result">
<h2>チェック結果</h2>
<p>生体を選んで「相性をチェック」を押すと、結果が表示されます。</p>
